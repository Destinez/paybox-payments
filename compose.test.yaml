name: paybox-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paybox
      POSTGRES_PASSWORD: paybox
      POSTGRES_DB: paybox_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paybox -d paybox_test"]
      interval: 1s
      timeout: 3s
      retries: 30
