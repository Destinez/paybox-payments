name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paybox
          POSTGRES_PASSWORD: paybox
          POSTGRES_DB: paybox_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd 'pg_isready -U paybox -d paybox_test'
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://paybox:paybox@localhost:55432/paybox_test
      TEST_DATABASE_URL: postgres://paybox:paybox@localhost:55432/paybox_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
