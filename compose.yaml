name: paybox
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paybox
      POSTGRES_PASSWORD: paybox
      POSTGRES_DB: paybox
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paybox -d paybox"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://paybox:paybox@postgres:5432/paybox
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    environment: &service_env
      DATABASE_URL: postgres://paybox:paybox@postgres:5432/paybox
      PAYSTACK_MODE: ${PAYSTACK_MODE:-fake}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_WEBHOOK_SECRETS: ${PAYSTACK_WEBHOOK_SECRETS:-}
      PAYSTACK_ACCEPT_LEGACY_SIGNATURE: ${PAYSTACK_ACCEPT_LEGACY_SIGNATURE:-false}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATA_KEY: ${DATA_KEY:-}
      WEB_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      DEMO_MODE: ${DEMO_MODE:-true}
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    build: .
    command: ["node", "apps/api/dist/worker.js"]
    environment: *service_env
    depends_on:
      migrate: { condition: service_completed_successfully }
  merchant-receiver:
    image: node:22-bookworm-slim
    working_dir: /receiver
    command: ["node", "server.mjs"]
    volumes: ["./examples/merchant-receiver:/receiver:ro"]
    ports: ["127.0.0.1:4100:4100"]
  web:
    build: .
    command: ["pnpm", "--filter", "@paybox/web", "start"]
    environment:
      API_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
